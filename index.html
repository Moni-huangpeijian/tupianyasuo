<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>朋友圈海报生成器</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>朋友圈海报生成器</h1>
            <p>输入产品信息，一键生成营销文案</p>
        </header>

        <main class="app-layout">
            <section class="form-card">
                <h2>填写商品信息</h2>
                <div class="form-group">
                    <label for="productName">产品名</label>
                    <input id="productName" type="text" placeholder="如：轻养生花果茶" maxlength="30">
                </div>

                <div class="form-group">
                    <label for="sellingPoints">卖点（可多条，使用顿号/逗号分隔）</label>
                    <textarea id="sellingPoints" rows="4" placeholder="如：0蔗糖、真材实料、冷泡热泡都好喝"></textarea>
                </div>

                <div class="form-group">
                    <label for="price">价格</label>
                    <input id="price" type="text" placeholder="如：39.9元/盒">
                </div>

                <button id="generateBtn" class="primary-btn">生成营销文案</button>
            </section>

            <section class="poster-card">
                <h2>海报预览</h2>
                <div class="poster" id="posterPreview">
                    <div class="poster-tag">朋友圈推荐</div>
                    <h3 id="posterProduct">你的产品名</h3>
                    <p id="posterCopy">填写左侧信息后，点击“生成营销文案”，这里会自动生成一段可直接发朋友圈的营销文案。</p>
                    <div class="poster-price" id="posterPrice">¥ --</div>
                </div>
                <div class="actions">
                    <button id="copyBtn" class="secondary-btn">复制文案</button>
                    <span id="copyFeedback" aria-live="polite"></span>
                </div>
            </section>
        </main>

        <footer class="footer">
            <p>© 2026 朋友圈海报生成器</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
